apiVersion: apps/v1
kind: Deployment
metadata:
  name: pair41
  labels: { app: pair41 }
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: pair41 }
  template:
    metadata:
      labels: { app: pair41 }
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: pair41
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: pair41
          env:
            - name: PAIR41_PUBLIC_URL
              value: 'https://{{ .Values.host }}'
            - name: PAIR41_DATABASE_SSL
              value: '{{ .Values.databaseSsl }}'
            - name: LOG_LEVEL
              value: '{{ .Values.logLevel }}'
            - name: OTEL_SERVICE_NAME
              value: pair41
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: 'deployment.environment=work-1,service.namespace={{ .Values.namespace }}'
            {{- if .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: '{{ .Values.otel.endpoint }}'
            {{- end }}
          livenessProbe:
            httpGet: { path: /live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
