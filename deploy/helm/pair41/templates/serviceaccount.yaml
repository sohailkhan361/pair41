# The pods' identity on work-1. team-5 already has an EKS Pod Identity association for the service account `app`,
# so there is no IRSA annotation here. A pre-install hook, so it exists before the migrate Job (also a hook) needs it;
# upgrades leave it alone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
  labels: { app: pair41 }
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: '-20'
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
