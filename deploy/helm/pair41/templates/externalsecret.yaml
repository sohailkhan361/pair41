# Copies the values from Parameter Store into two Kubernetes Secrets: one for the app, one for migrations only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pair41
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-10'
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-parameter-store
  target:
    name: pair41
  data:
    - secretKey: PAIR41_DATABASE_URL
      remoteRef:
        key: /hackathon/{{ .Values.namespace }}/pair41/{{ .Values.parameters.databaseUrl }}
    - secretKey: PAIR41_INVITE_CODE
      remoteRef:
        key: /hackathon/{{ .Values.namespace }}/pair41/{{ .Values.parameters.inviteCode }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pair41-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-10'
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-parameter-store
  target:
    name: pair41-migrate
  data:
    - secretKey: PAIR41_MIGRATION_DATABASE_URL
      remoteRef:
        key: /hackathon/{{ .Values.namespace }}/pair41/{{ .Values.parameters.migrationDatabaseUrl }}
